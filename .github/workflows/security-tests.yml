name: Security regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/segmentation-plan.js
          node --check lib/parser.js
          node --check lib/analysis-pool.js
          node --check lib/analysis-worker.js
          node --check lib/analyzer.js
          node --check lib/constants.js
          node --check lib/coverage.js
          node --check lib/deploy-safety.js
          node --check lib/forticonfig.js
          node --check lib/ports.js
          node --check lib/store.js
      - name: Run tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker image
        run: docker compose build
      - name: Start container
        run: docker compose up -d
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T fortiflow node -e "require('http').get('http://localhost:3737/', r => process.exit(r.statusCode === 200 ? 0 : 1))"; then
              echo "Healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run tests in container
        run: docker compose exec -T fortiflow npm test
      - name: Cleanup
        if: always()
        run: docker compose down -v

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build image for scanning
        run: docker compose build
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fortiflow_fortiflow:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  publish-ghcr:
    needs: [node-tests, docker-build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/tetrax/fortiflow
          docker compose build
          docker tag fortiflow-fortiflow:latest $IMAGE:latest
          docker tag fortiflow-fortiflow:latest $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
