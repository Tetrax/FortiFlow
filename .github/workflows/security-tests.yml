name: Security regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check lib/parser.js
          node --check lib/analysis-pool.js
          node --check lib/analysis-worker.js
          node --check lib/analyzer.js
          node --check lib/forticonfig.js
      - name: Run tests
        run: npm test
