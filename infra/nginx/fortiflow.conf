# FortiFlow — Reverse proxy Nginx
# À placer dans /etc/nginx/sites-available/fortiflow.conf
# Puis : ln -s /etc/nginx/sites-available/fortiflow.conf /etc/nginx/sites-enabled/

server {
    listen 443 ssl http2;
    server_name fortiflow.devval.com;

    ssl_certificate     /etc/letsencrypt/live/devval.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devval.com/privkey.pem;

    # Sécurité TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 2048m;

    # Le processus Node ne fait confiance à X-Forwarded-For que si l’adresse
    # source de ce proxy est déclarée via FORTIFLOW_TRUST_PROXY dans Docker.
    # Ne jamais activer une confiance globale ("*") si le port interne est exposé.

    location / {
        proxy_pass http://127.0.0.1:13737;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
