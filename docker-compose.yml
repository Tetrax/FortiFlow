services:
  fortiflow:
    build:
      context: ./app/web
      dockerfile: Dockerfile
    container_name: fortiflow
    restart: unless-stopped
    ports:
      # Nginx expose le HTTPS public sur 3737 et relaie vers ce backend local.
      - "127.0.0.1:13737:3737"
    environment:
      - PORT=3737
      # Taille maximale d’un export FAZ brut (Mo)
      - MAX_UPLOAD_SIZE_MB=2048
      # Les analyses lourdes s'exécutent hors du thread HTTP. Un worker par défaut
      # évite de saturer la mémoire avec plusieurs exports FAZ volumineux.
      - MAX_ANALYSIS_WORKERS=1
      - MAX_ANALYSIS_QUEUE=3
      # Optionnel : plafond mémoire par worker (Mo), 0 = limite Node par défaut.
      - ANALYSIS_WORKER_MEMORY_MB=0
      # HTTPS optionnel — décommenter si certificats disponibles :
      # - SSL_KEY=/certs/privkey.pem
      # - SSL_CERT=/certs/fullchain.pem
    volumes:
      # Persistance des sessions et des workspaces entre redémarrages
      - ./data/sessions-cache:/sessions-cache
      - ./data/workspaces:/app/workspaces
      - ./data/uploads:/app/uploads
      # HTTPS — monter le répertoire des certificats en lecture seule :
      # - /etc/ssl/fortiflow:/certs:ro
